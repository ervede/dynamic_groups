name: Release

# Creates a GitHub release automatically when the version in manifest.json
# changes on main. To publish a new version: bump "version" in
# custom_components/dynamic_groups/manifest.json and push. The release is only
# created after the tests and validation pass.

on:
  push:
    branches: [main]
    paths:
      - custom_components/dynamic_groups/manifest.json
      - .github/workflows/release.yml
      - .github/scripts/release.sh
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          version=$(jq -r .version custom_components/dynamic_groups/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "manifest version '$version' is not x.y.z" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}, tag already exists: ${exists}"
        env:
          GH_TOKEN: ${{ github.token }}

  tests:
    name: Tests
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  validate:
    name: Validate
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    name: Create release
    needs: [version, tests, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update changelog and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/release.sh
